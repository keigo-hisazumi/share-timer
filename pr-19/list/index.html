<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タイマー一覧 - Share Timer</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Share Timer">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page">
  <header class="app-header">
    <a href="../" class="app-header-back">← トップ</a>
    <h1>タイマー一覧</h1>
  </header>
  <main class="page-main">
    <form id="id-form" class="card">
      <h2>ID を入力して開く</h2>
      <div class="row">
        <input id="view-id" type="text" class="input-id" placeholder="表示 ID（例: abcd2345）" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <button type="submit" class="btn btn-primary">表示</button>
      </div>
      <p class="muted">タイマーの作成者から共有された表示 ID、または表示画面の URL を入力してください。</p>
    </form>

    <p id="notice" class="notice" hidden></p>

    <section class="card">
      <h2>これまでに作成されたタイマー</h2>
      <p id="list-status" class="muted">読み込み中…</p>
      <ul id="timer-list" class="timer-list"></ul>
    </section>
  </main>
  <p id="message" class="message" role="status" hidden></p>
  <script type="module" src="../js/list.js"></script>
  <script type="module" src="../js/pwa.js"></script>
</body>
</html>
