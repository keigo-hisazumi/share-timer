<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Share Timer 管理画面</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Timer 管理">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin">
  <main class="admin-main">
    <header class="admin-header">
      <h1>タイマー管理</h1>
      <a href="../" target="_blank" rel="noopener">タイマー画面を開く ↗</a>
    </header>

    <section class="card preview">
      <div id="timer" class="timer timer-preview" data-status="loading">--:--</div>
      <p class="status-line">
        <span id="status-label" class="badge">接続中…</span>
        <span id="duration-label" class="muted"></span>
      </p>
    </section>

    <p id="notice" class="notice" hidden></p>

    <form id="login-form" class="card" hidden>
      <h2>ログイン</h2>
      <p class="muted">タイマーを操作するには管理者アカウントでログインしてください。</p>
      <div class="row">
        <input id="email" type="email" autocomplete="username" placeholder="メールアドレス" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="パスワード" required>
        <button type="submit" class="btn btn-primary">ログイン</button>
      </div>
    </form>

    <div id="controls" hidden>
      <section class="card">
        <h2>操作</h2>
        <div class="row controls">
          <button type="button" class="btn btn-start" data-action="start">▶ スタート</button>
          <button type="button" class="btn btn-pause" data-action="pause">❚❚ 一時停止</button>
          <button type="button" class="btn btn-reset" data-action="reset">↺ リセット</button>
        </div>
      </section>

      <form id="duration-form" class="card">
        <h2>時間設定</h2>
        <div class="row duration-inputs">
          <label><input id="hours" type="number" min="0" max="99" value="0" inputmode="numeric"> 時間</label>
          <label><input id="minutes" type="number" min="0" max="59" value="5" inputmode="numeric"> 分</label>
          <label><input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric"> 秒</label>
          <button type="submit" class="btn btn-primary">設定</button>
        </div>
        <div class="row presets">
          <button type="button" class="btn btn-small" data-preset="60">1分</button>
          <button type="button" class="btn btn-small" data-preset="180">3分</button>
          <button type="button" class="btn btn-small" data-preset="300">5分</button>
          <button type="button" class="btn btn-small" data-preset="600">10分</button>
          <button type="button" class="btn btn-small" data-preset="1800">30分</button>
          <button type="button" class="btn btn-small" data-preset="3600">60分</button>
        </div>
        <p class="muted">時間を設定すると、タイマーは停止状態でその時間にリセットされます。</p>
      </form>

    </div>

    <p id="account" class="account muted" hidden>
      <span id="account-email"></span>
      <button type="button" id="logout" class="btn-link">ログアウト</button>
    </p>

    <p id="message" class="message" role="status" hidden></p>
  </main>
  <script type="module" src="../js/admin.js"></script>
  <script type="module" src="../js/pwa.js"></script>
</body>
</html>
