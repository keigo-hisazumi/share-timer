<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- 管理 ID を含む URL を外部サイトへ送らない -->
  <meta name="referrer" content="no-referrer">
  <title>タイマー管理 - Share Timer</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Share Timer">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page">
  <header class="app-header">
    <a href="../" class="app-header-back">← トップ</a>
    <h1>タイマー管理</h1>
  </header>
  <main class="page-main">
    <p id="notice" class="notice" hidden></p>

    <div id="manage" hidden>
      <section class="card share">
        <h2>共有用の表示 ID</h2>
        <p class="share-id"><code id="view-id"></code></p>
        <p class="muted">この ID（または URL）を見てほしい人に伝えてください。タイマー一覧の入力欄に ID を入れると表示画面が開きます。</p>
        <div class="row">
          <button type="button" class="btn btn-small" id="copy-view-url">表示画面の URL をコピー</button>
          <a id="open-view" class="btn btn-small" target="_blank" rel="noopener">表示画面を開く ↗</a>
        </div>
      </section>

      <section class="card preview">
        <p id="title-preview" class="title-preview"></p>
        <div id="timer" class="timer timer-preview" data-status="loading">--:--</div>
        <p class="status-line">
          <span id="status-label" class="badge">接続中…</span>
          <span id="duration-label" class="muted"></span>
        </p>
      </section>

      <section class="card">
        <h2>操作</h2>
        <div class="row controls">
          <button type="button" class="btn btn-start" data-action="start">▶ スタート</button>
          <button type="button" class="btn btn-pause" data-action="pause">❚❚ 一時停止</button>
          <button type="button" class="btn btn-reset" data-action="reset">↺ リセット</button>
        </div>
      </section>

      <form id="title-form" class="card">
        <h2>タイトル</h2>
        <div class="row">
          <input id="title" type="text" class="input-text" maxlength="50" autocomplete="off">
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
        <p class="muted">一覧と表示画面に表示されます。未記入の場合は設定時間を表示します。</p>
      </form>

      <form id="duration-form" class="card">
        <h2>時間設定</h2>
        <div class="row duration-inputs">
          <label><input id="hours" type="number" min="0" max="99" value="0" inputmode="numeric"> 時間</label>
          <label><input id="minutes" type="number" min="0" max="59" value="5" inputmode="numeric"> 分</label>
          <label><input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric"> 秒</label>
          <button type="submit" class="btn btn-primary">設定</button>
        </div>
        <div class="row presets">
          <button type="button" class="btn btn-small" data-preset="60">1分</button>
          <button type="button" class="btn btn-small" data-preset="180">3分</button>
          <button type="button" class="btn btn-small" data-preset="300">5分</button>
          <button type="button" class="btn btn-small" data-preset="600">10分</button>
          <button type="button" class="btn btn-small" data-preset="1800">30分</button>
          <button type="button" class="btn btn-small" data-preset="3600">60分</button>
        </div>
        <p class="muted">時間を設定すると、タイマーは停止状態でその時間にリセットされます。</p>
      </form>

      <section class="card">
        <h2>管理用 ID</h2>
        <p><code id="manage-id"></code></p>
        <p class="muted">この画面の URL（管理用 ID）を知っている人は誰でもタイマーを操作できます。他の人には教えず、あとで操作できるようにブックマークなどで保管してください。</p>
        <div class="row">
          <button type="button" class="btn btn-small" id="copy-manage-url">管理画面の URL をコピー</button>
        </div>
      </section>
    </div>
  </main>
  <p id="message" class="message" role="status" hidden></p>
  <script type="module" src="../js/manage.js"></script>
  <script type="module" src="../js/pwa.js"></script>
</body>
</html>
