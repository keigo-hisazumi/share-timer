# Release Drafter 設定（release-drafter v7 形式）
#
# PR タイトルの Conventional Commits プレフィックスでリリースノートを分類し、次のバージョンを決定する。
# （PR タイトルの形式は `.github/workflows/pr-title.yml` で検証している）
# ラベル `breaking` を付けた PR、または `feat!:` のような破壊的変更はメジャーバージョンを上げる。

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "新機能"
    semver-increment: minor
    exclusive: true
    when:
      conventional:
        type: "feat"
  - title: "バグ修正"
    exclusive: true
    when:
      conventional:
        type: "fix"
  - title: "依存関係の更新"
    collapse-after: 3
    exclusive: true
    when:
      label: "dependencies"
  - title: "ドキュメント"
    exclusive: true
    when:
      conventional:
        type: "docs"
  - title: "CI/CD・内部改善"
    exclusive: true
    when:
      - conventional:
          types: ["refactor", "perf", "test", "build", "ci", "chore", "style", "revert"]
  - title: "その他"
  - type: "pre-exclude"
    when:
      label: "skip-changelog"
  - type: "version-resolver"
    semver-increment: major
    when:
      - label: "breaking"
      - conventional:
          breaking: true

change-template: "- $TITLE (#$NUMBER) $AUTHORS"
change-title-escapes: '\<*_&'

template: |
  ## 変更内容

  $CHANGES
