# GitHub Pages デプロイワークフロー
#
# main ブランチへのプッシュ時に dist/ をビルドし、gh-pages ブランチのルートへ公開します。
# PR プレビュー（pr-* ディレクトリ）は残したまま本番部分だけを入れ替えます。
#
# 事前準備（README の「GitHub Pages での公開」を参照）:
#   - リポジトリ変数 FIREBASE_CONFIG に Firebase のウェブアプリ設定（JSON またはコンソールの JS スニペット）を登録
#   - Settings → Pages で「Deploy from a branch」→ gh-pages / (root) を選択

name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js のセットアップ
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: 依存関係のインストール
        run: npm ci
      - name: ビルド
        run: npm run build
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          TIMER_PATH: timer
      - name: gh-pages ブランチへのデプロイ
        run: scripts/gh-pages.sh deploy dist .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
