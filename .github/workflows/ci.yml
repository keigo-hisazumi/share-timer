# CI ワークフロー
#
# Node.js / npm プロジェクト向けの標準 CI パイプラインです。
# 本プロジェクトは外部依存なし・ビルド不要のため、Lint（構文チェック）とテストのみ実行します。
# 言語やパッケージマネージャーが異なる場合は、各ステップを差し替えてください:
#   - Python: actions/setup-python + pip/poetry/uv
#   - Go: actions/setup-go
#   - pnpm/yarn の場合は cache: 'npm' を 'pnpm'/'yarn' に変更

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 依存関係のインストール
        run: npm ci
      - name: Lint
        run: npm run lint

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 依存関係のインストール
        run: npm ci
      - name: テスト
        run: npm test
