# PR ごとに Playwright でスクリーンショットを撮影し、PR コメントに貼り付けるワークフローの雛形。
#
# 利用方法:
#   1. リポジトリに Playwright を導入し、`@screenshot` タグを付けたテストを用意する
#      （例: `tests/screenshots.spec.ts`）。
#   2. ビルド/起動コマンドを実プロジェクトに合わせて差し替える。
#   3. 日本語フォントが必要な場合は `fonts-noto-cjk` をインストールする。
#
# 必要に応じて Vercel/Cloudflare Pages のプレビュー URL を使う方式や、
# Chromatic / Percy のようなビジュアルリグレッション SaaS への置き換えも検討してください。

name: Screenshot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    permissions:
      contents: read
      pull-requests: write
    # Playwright 導入後、リポジトリ変数 ENABLE_SCREENSHOT を `true` に設定すると有効化される
    if: vars.ENABLE_SCREENSHOT == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 日本語フォントをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -fv

      # TODO: 実プロジェクトに合わせて setup-node / pnpm などへ差し替え
      # - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      #   with:
      #     node-version-file: .nvmrc
      #     cache: pnpm
      # - run: pnpm install --frozen-lockfile
      # - run: pnpm build
      # - run: npx playwright install --with-deps chromium
      # - run: npx playwright test --grep @screenshot

      - name: スクリーンショットをアップロード
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      # TODO: PR コメントへの自動添付
      # 画像を表示するには公開 URL が必要なため、以下のいずれかの方法で実現してください:
      #   (a) `actions/upload-artifact` のリンクをコメントに貼る（簡易）
      #   (b) `peter-evans/create-or-update-comment` を使ってアーティファクト URL を投稿
      #   (c) S3/Cloudflare R2 などにアップロードして公開 URL を取得し、`![](url)` で埋め込む
      # - name: PR にコメントを投稿
      #   uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
      #   with:
      #     issue-number: ${{ github.event.pull_request.number }}
      #     body: |
      #       ## スクリーンショット
      #       アーティファクト: ${{ steps.upload.outputs.artifact-url }}
