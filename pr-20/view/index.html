<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share Timer</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Share Timer">
  <link rel="stylesheet" href="../css/style.css">
  <script>
    // OBS のブラウザソースで開かれたときは背景を透過にする（OBS は window.obsstudio を用意する）。
    // 黒い背景が一瞬表示されないよう、描画前に判定する
    if (window.obsstudio) document.documentElement.classList.add('obs');
  </script>
</head>
<body class="viewer">
  <main class="viewer-main" title="クリックで全画面表示">
    <div id="timer" class="timer" data-status="loading" aria-live="off">--:--</div>
  </main>
  <p id="notice" class="notice" hidden></p>
  <div id="connection" class="connection" hidden>再接続中…</div>
  <script type="module" src="../js/view.js"></script>
  <script type="module" src="../js/pwa.js"></script>
</body>
</html>
